[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nhc"
version = "0.1.0"
description = "Nethack-like Crawler — roguelike with LLM narrative"
requires-python = ">=3.14"
dependencies = [
    "pyyaml",
    "blessed",
    "aiofiles",
]

[project.optional-dependencies]
llm = [
    "anthropic",
    "ollama",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "maturin",
]
tts = [
    "piper-tts>=1.3.0",
    "onnxruntime",
    "requests",
]
debug = [
    "mcp",
]
# Phase M perf bench (plans/wasm-render-caching.md). Opt-in: the
# base install never pulls it. Bootstrap with `make perf-bootstrap`
# (also fetches the Chromium binary, which is not a pip dep).
perf = [
    "playwright",
]

[project.scripts]
nhc = "nhc.main:entry"

[tool.setuptools.packages.find]
include = ["nhc*"]
exclude = ["debug*", "design*", "crates*", "target*", "deploy*",
           "levels*", "content*", "hextiles*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "core: core engine tests",
    "dungeon: dungeon generation tests",
    "entities: entity registry tests",
    "rules: Knave rules tests",
    "narrative: LLM narrative tests",
    "slow: slow tests (subprocess / pool warmup / ~120s); skipped by default, run with `-m slow`",
    "validator: multilingual table drift validation; run explicitly via `-m validator`",
    "perf: WASM render benches (browser, opt-in); run explicitly via `-m perf` after `make perf-bootstrap`",
]
